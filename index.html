<style>
/* Layout: filter rail on the left (stacks on top under 900px), swatch-card grid on the right */
:root{
  --bg:#f7f3f8; --card:#fffdfe; --ink:#2a1f30; --muted:#76697c; --line:#e6dbe9;
  --plum:#52345f; --lav:#ece3f1; --chip:#f1eaf5; --gold:#a8822f; --band:#f1eff2; --band-ink:#5a535e;
  --display:"Montserrat",system-ui,-apple-system,sans-serif; --body:"DM Sans",system-ui,-apple-system,sans-serif;
  --c-p:#d9779b; --c-r:#b8323c; --c-o:#d9772f; --c-y:#d4a72c; --c-g:#4f8a4b; --c-t:#1f8f8a; --c-b:#2f5fa8; --c-u:#6b4596; --c-n:#7a5132; --c-k:#4a4a52;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#171217; --card:#211a23; --ink:#f1eaf3; --muted:#a898ad; --line:#362c39;
  --plum:#e0d3e8; --lav:#2f2436; --chip:#2a2130; --gold:#d9b46a; --band:#2b252d; --band-ink:#bcb2c0;
  --c-p:#e58aad; --c-r:#d4545d; --c-o:#e88d45; --c-y:#e2bb48; --c-g:#6aa865; --c-t:#36aaa4; --c-b:#5683cc; --c-u:#9170bd; --c-n:#a0724c; --c-k:#7a7a84; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#171217; --card:#211a23; --ink:#f1eaf3; --muted:#a898ad; --line:#362c39;
  --plum:#e0d3e8; --lav:#2f2436; --chip:#2a2130; --gold:#d9b46a; --band:#2b252d; --band-ink:#bcb2c0;
  --c-p:#e58aad; --c-r:#d4545d; --c-o:#e88d45; --c-y:#e2bb48; --c-g:#6aa865; --c-t:#36aaa4; --c-b:#5683cc; --c-u:#9170bd; --c-n:#a0724c; --c-k:#7a7a84; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);margin:0;font-size:15px;line-height:1.45;
  padding-block:28px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.page{max-width:1180px;margin:0 auto;display:grid;gap:22px}
.hero{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 24px}
.topbar{background:#fff;margin:-28px calc(-1 * max(16px, env(safe-area-inset-right, 0px))) 64px calc(-1 * max(16px, env(safe-area-inset-left, 0px)));padding:52px 16px;display:flex;justify-content:center}
.topbar a{display:block;line-height:0;border-radius:6px}
.topbar svg{width:clamp(155px,37vw,210px);height:auto}
footer a{color:var(--plum);font-weight:700;text-decoration:none;border-bottom:1px solid var(--gold)}
footer a:hover{color:var(--gold)}
h1{font-family:var(--display);font-weight:800;font-size:clamp(30px,5vw,46px);line-height:1.05;margin:0;color:var(--plum);text-wrap:balance}
.side{display:grid;gap:14px;align-content:start;min-width:0}
@media (min-width:901px) and (min-height:980px){.side{position:sticky;top:calc(16px + env(safe-area-inset-top,0px))}}
@media (max-width:900px){.side{display:contents}.rail{order:0}main{order:1}.statcard{order:2}}
.statcard{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px 18px;display:grid;gap:12px}
.statcard .glabel{margin:0}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:12px 16px;font-variant-numeric:tabular-nums}
.stat b{display:block;font-family:var(--display);font-size:18px;line-height:1.2;color:var(--ink)}
.stat span{font-size:11px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.layout{display:grid;grid-template-columns:270px minmax(0,1fr);gap:24px;align-items:start}
@media (max-width:900px){.layout{grid-template-columns:minmax(0,1fr)}}
.rail{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;display:grid;gap:18px;}
.group{display:grid;gap:8px}
.glabel{font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--plum)}
input[type=search],select{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
input[type=search]:focus-visible,select:focus-visible,button:focus-visible,a:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.seg{display:grid;grid-template-columns:repeat(3,1fr);background:var(--chip);border-radius:12px;padding:4px;gap:4px}
.seg button{font:inherit;font-size:13px;font-weight:600;border:0;border-radius:9px;padding:7px 4px;background:transparent;color:var(--muted);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgb(0 0 0/.12)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.dd summary{list-style:none;display:flex;align-items:center;justify-content:space-between;gap:8px;cursor:pointer;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:10px 12px;user-select:none}
.dd summary::-webkit-details-marker{display:none}
.dd summary span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.dd summary::after{content:"";flex:none;width:8px;height:8px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:translateY(-2px) rotate(45deg);transition:transform .15s}
.dd[open] summary::after{transform:translateY(2px) rotate(-135deg)}
.dd summary.on{border-color:var(--plum)}
.dd .chips{padding:10px 2px 2px}
.chip{font:inherit;font-size:13px;display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:99px;padding:5px 10px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--plum);border-color:var(--plum);color:var(--card)}
.chip .dot{width:11px;height:11px;border-radius:50%;flex:none;box-shadow:inset 0 0 0 1px rgb(0 0 0/.15)}
.chip small{font-size:11px;opacity:.65;font-variant-numeric:tabular-nums}
.toggle{display:flex;align-items:center;gap:10px;font-size:14px;cursor:pointer}
.toggle input{width:18px;height:18px;accent-color:var(--plum)}
.clear{font:inherit;font-size:13px;font-weight:700;background:none;border:0;color:var(--plum);cursor:pointer;padding:0;justify-self:start;text-decoration:underline;text-underline-offset:3px}
.bar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
.count{font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums}
.count b{color:var(--ink)}
.sort{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
.sort select{width:auto;padding:7px 10px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px}
@media (max-width:560px){.grid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}.card{--pad:11px}.swatch{height:74px}.name{font-size:15px}.times{top:16px;right:16px}}
.more-btn{display:none;font:inherit;font-size:13px;font-weight:700;border:1px solid var(--line);background:var(--chip);color:var(--plum);border-radius:12px;padding:9px 12px;cursor:pointer}
@media (max-width:900px){.more-btn{display:block}.rail:not([data-open]) .more{display:none}}
.card{--pad:14px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:var(--pad);display:flex;flex-direction:column;gap:10px;min-width:0;position:relative}
.swatch{height:92px;border-radius:var(--blob);background:var(--sw);position:relative;overflow:hidden}
.swatch::after{content:"";position:absolute;inset:0;background:radial-gradient(120% 90% at 25% 20%,rgb(255 255 255/.28),transparent 55%),radial-gradient(90% 80% at 80% 90%,rgb(0 0 0/.22),transparent 60%)}
.swatch.shimmer::before{content:"";position:absolute;inset:0;z-index:1;opacity:.85;
  background-image:radial-gradient(circle,rgb(255 236 170/.95) 0 1px,transparent 1.6px),radial-gradient(circle,rgb(255 255 255/.8) 0 .8px,transparent 1.4px);
  background-size:13px 11px,9px 14px;background-position:0 0,5px 6px}
.swatch.sheen{box-shadow:inset -10px -8px 0 -2px rgb(150 60 160/.35)}
.times{position:absolute;top:20px;right:20px;z-index:2;min-width:24px;height:24px;padding:0 6px;border-radius:99px;display:grid;place-items:center;
  font-family:var(--display);font-size:11px;font-weight:700;background:var(--card);color:var(--plum);box-shadow:0 1px 4px rgb(0 0 0/.18);font-variant-numeric:tabular-nums}
.swatch.photo{border-radius:14px;background:var(--sw);box-shadow:inset 0 0 0 1px rgb(0 0 0/.06)}.swatch.photo::before,.swatch.photo::after{display:none}
.swatch.photo img{display:block;width:100%;height:100%;object-fit:cover}
.card:has(.meta) .inked{margin-top:2px}
.inked{order:99;margin:auto calc(-1 * var(--pad)) calc(-1 * var(--pad));padding:8px 10px;background:var(--band);border-top:1px solid var(--line);border-radius:0 0 15px 15px;text-align:center;font-size:12px;font-weight:400;color:var(--band-ink);font-variant-numeric:tabular-nums}
.name{font-family:var(--display);font-weight:700;font-size:16px;line-height:1.2;margin:0;overflow-wrap:anywhere}
.brand{font-size:13px;color:var(--muted);margin-top:2px}
.meta{display:flex;flex-wrap:wrap;gap:4px;margin-top:auto}
.tag{font-size:9.5px;font-weight:600;letter-spacing:.03em;line-height:1.3;border-radius:99px;padding:2px 6px;background:var(--chip);color:var(--muted)}
.tag.vol{color:var(--plum);background:var(--lav)}
.shop{font-family:var(--display);font-size:12px;font-weight:700;color:var(--plum);text-decoration:none;align-self:flex-start;border-bottom:2px solid var(--gold);padding-bottom:1px}
.shop:hover{color:var(--gold)}
.pager{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.pager .pg{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.pager .pg b{color:var(--ink)}
.pager .btns{display:flex;gap:6px}
.pager button{font:inherit;font-size:13px;font-weight:700;border:1px solid var(--line);background:var(--card);color:var(--plum);border-radius:99px;padding:7px 14px;cursor:pointer}
.pager button:disabled{opacity:.4;cursor:default}
.pager button:not(:disabled):hover{background:var(--chip)}
main{display:grid;gap:14px;align-content:start;min-width:0}
.empty{grid-column:1/-1;text-align:center;padding:48px 16px;color:var(--muted);background:var(--card);border:1px dashed var(--line);border-radius:16px}
footer{font-size:12px;color:var(--muted);display:flex;flex-direction:column;align-items:center;text-align:center;gap:8px;margin-top:40px;padding-top:24px;border-top:1px solid var(--line)}
@media (prefers-reduced-motion:no-preference){.card{transition:transform .15s ease}.card:hover{transform:translateY(-2px)}}
.titles{display:flex;flex-direction:column;align-items:flex-start;gap:14px}
.switch{font-family:var(--display);font-size:13px;font-weight:700;color:var(--plum);background:var(--card);border:1px solid var(--line);border-radius:99px;padding:8px 14px;text-decoration:none;white-space:nowrap}
.switch:hover{background:var(--chip)}
</style>
</head>

<script>

      (!state.props.size || [...state.props].every(k => r.p.includes(k))) &&
      (!state.brand || r.brand === state.brand) &&
      (!state.shop || r.link));
    const byName = (a, b) => coll.compare(strip(a.name), strip(b.name));
    list.sort(state.sort === "brand" ? (a, b) => coll.compare(a.brand, b.brand) || byName(a, b)
      : state.sort === "inked" ? (a, b) => b.t - a.t || byName(a, b) : byName);
    const pages = Math.max(1, Math.ceil(list.length / PER));
    page = Math.min(Math.max(0, page), pages - 1);
    const from = page * PER, shown = list.slice(from, from + PER);
    const frag = document.createDocumentFragment();
    for (const r of shown) frag.append(card(r));
    if (!list.length){ const e = document.createElement("div"); e.className = "empty"; e.textContent = "No inks match those filters. Try removing one."; frag.append(e); }
    $("grid").replaceChildren(frag);
    $("count").innerHTML = list.length === inks.length ? `<b>${inks.length}</b> inks` : `<b>${list.length}</b> of ${inks.length} inks match`;
    for (const id of ["pagerTop", "pagerBot"]){
      const nav = $(id); nav.hidden = pages < 2; if (pages < 2) continue;
      const pg = document.createElement("span"); pg.className = "pg";
      pg.innerHTML = `Showing <b>${from + 1}–${from + shown.length}</b> of ${list.length} · Page ${page + 1} of ${pages}`;
      const btns = document.createElement("div"); btns.className = "btns";
      const mk = (label, to) => { const b = document.createElement("button"); b.type = "button"; b.textContent = label; b.disabled = to < 0 || to >= pages;
        b.addEventListener("click", () => { render(to); $("pagerTop").scrollIntoView({ block: "start", behavior: "smooth" }); }); return b; };
      btns.append(mk("‹ Previous", page - 1), mk("Next ›", page + 1));
      nav.replaceChildren(pg, btns);
    }
    const sum = (id, set, names, any) => { const el = $(id); el.textContent = set.size ? [...set].map(k => names[k]).join(", ") : any; el.parentElement.classList.toggle("on", set.size > 0); };
    sum("colorSum", state.colors, cName, "Any color"); sum("propSum", state.props, pName, "Any properties");
    $("clear").hidden = !(state.q || state.v || state.colors.size || state.props.size || state.brand || state.shop);
  }
  render();
})();
</script>

</body>
</html>
